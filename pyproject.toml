[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tracemillai"
version = "0.1.0"
description = "Failure-preserving JSONL agent trace reducer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "RequiredTruth"}]
[project.scripts]
tracemillai = "tracemillai.cli:main"
[tool.setuptools.packages.find]
include = ["tracemillai*"]
